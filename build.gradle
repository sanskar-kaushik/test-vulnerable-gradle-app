
plugins {
    id 'java'
}

group = 'com.secagent.demo'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    // ==========================================
    // SCENARIO 1: DIRECT VULNERABILITY
    // ==========================================

    // Intentionally vulnerable Log4j version.
    implementation 'org.apache.logging.log4j:log4j-core:2.25.4'

    // ==========================================
    // SCENARIO 2: TRANSITIVE VULNERABILITY
    // ==========================================

    // Introduces commons-text:1.8 transitively.
    // commons-text is NOT declared directly.
    implementation 'org.apache.commons:commons-configuration2:2.15.0'

    // ==========================================
    // TEST DEPENDENCIES
    // ==========================================

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

test {
    useJUnitPlatform()
}
